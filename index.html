<!DOCTYPE html>
<html lang="bn"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ebook.com – বাংলা ই-বুক শপ</title>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f5fb;--card:#fff;--tx:#0d1b3a;--mu:#5b6985;--pr:#1f6feb;--pr2:#0a3d9c;--nv:#0a1a3f;--gd:#c9a24a;--bd:#dfe6f3;--ok:#12805a;--sh:0 10px 30px rgba(10,30,90,.10);color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#081025;--card:#101b38;--tx:#eaf0ff;--mu:#9aa9c9;--pr:#4a90ff;--pr2:#79adff;--bd:#223158;--ok:#4cc38a;--sh:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#081025;--card:#101b38;--tx:#eaf0ff;--mu:#9aa9c9;--pr:#4a90ff;--pr2:#79adff;--bd:#223158;--ok:#4cc38a;--sh:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.65 "Hind Siliguri",system-ui,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:#0a1a3f;z-index:10}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:linear-gradient(90deg,#071433,#0f2a63);border-bottom:1px solid rgba(255,255,255,.08);display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;padding:10px 18px;box-shadow:0 4px 20px rgba(0,0,0,.25)}
.logo{display:flex;align-items:center;gap:10px;font-weight:700;font-size:22px;color:#fff;text-decoration:none;letter-spacing:.2px}
.logo .lg{width:44px;height:44px;border-radius:50%;box-shadow:0 0 0 2px rgba(201,162,74,.8)}
.logo b{color:#6fb0ff}
nav{display:flex;gap:4px;flex-wrap:wrap;margin-left:auto}
nav a{color:#d6e2ff;text-decoration:none;padding:6px 12px;border-radius:99px;font-size:15px;transition:.2s}
nav a:hover{background:rgba(255,255,255,.12)}nav a.on{background:#fff;color:#0a1a3f;font-weight:600}
main{max-width:1040px;margin:0 auto;padding:18px 16px}
.hero{position:relative;overflow:hidden;background:radial-gradient(circle at 85% 20%,#1f6feb 0,transparent 45%),linear-gradient(135deg,#071433,#0f2a63);color:#fff;border-radius:22px;padding:30px 26px;margin-bottom:18px;display:flex;align-items:center;gap:22px;box-shadow:var(--sh)}
.hero .hl{flex:1}.hero h1{margin:0 0 6px;font-size:30px;line-height:1.3}.hero h1 span{color:#e6c46d}
.hero p{margin:0 0 14px;opacity:.9}
.hero .hlogo{width:150px;height:150px;border-radius:50%;box-shadow:0 0 0 4px rgba(201,162,74,.85),0 0 50px rgba(74,144,255,.6);flex:none}
.bd{display:flex;gap:8px;flex-wrap:wrap}.bd span{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:4px 12px;border-radius:99px;font-size:13.5px}
.st{font-size:21px;margin:18px 0 0}
input,select,textarea{width:100%;padding:11px 14px;border:1px solid var(--bd);border-radius:12px;background:var(--card);color:var(--tx);font:inherit;transition:.2s}
input:focus,select:focus{outline:0;border-color:var(--pr);box-shadow:0 0 0 3px rgba(31,111,235,.2)}
#sq{padding:14px 18px;border-radius:14px;box-shadow:var(--sh)}
label{display:block;margin:10px 0 4px;font-weight:600;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.chip{white-space:nowrap;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:7px 16px;border-radius:99px;cursor:pointer;font:inherit;transition:.2s}
.chip:hover{border-color:var(--pr)}
.chip.on{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border-color:transparent}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.book{background:var(--card);border:1px solid var(--bd);border-radius:18px;overflow:hidden;display:flex;flex-direction:column;box-shadow:var(--sh);transition:.25s}
.book:hover{transform:translateY(-5px);box-shadow:0 16px 40px rgba(10,30,90,.2)}
.cov{position:relative;height:150px;display:flex;align-items:center;justify-content:center;font-size:56px;color:#fff;text-shadow:0 4px 14px rgba(0,0,0,.3)}
.cov::after{content:"PDF";position:absolute;top:10px;right:10px;background:var(--gd);color:#1a1405;font:700 11px/1 sans-serif;padding:5px 8px;border-radius:6px;letter-spacing:.5px}
.bi{padding:14px;display:flex;flex-direction:column;gap:2px;flex:1}
.bi b{font-size:16.5px;line-height:1.4}.mu{color:var(--mu);font-size:13px}
.pr{color:var(--pr);font-weight:700;font-size:20px}
.btn{background:linear-gradient(135deg,var(--pr),var(--pr2));color:#fff;border:0;border-radius:12px;padding:10px 18px;font:inherit;font-weight:600;cursor:pointer;transition:.2s;box-shadow:0 4px 14px rgba(31,111,235,.3);text-decoration:none;display:inline-block}
.btn.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd);box-shadow:none}.btn.r{background:#c0392b;box-shadow:none}
.btn:hover{filter:brightness(1.08);transform:translateY(-1px)}
.box{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:18px;margin-bottom:16px;box-shadow:var(--sh)}
.row{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--bd)}
.row:last-child{border:0}
.tag{display:inline-block;padding:2px 12px;border-radius:99px;font-size:13px;font-weight:600;background:var(--bg);border:1px solid var(--bd)}
.tag.ok{color:var(--ok)}.tag.no{color:#c0392b}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tabs{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.note{background:var(--bg);border:1px dashed var(--bd);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--mu)}
a{color:var(--pr)}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#0a1a3f;color:#fff;padding:11px 20px;border-radius:99px;opacity:0;transition:.25s;pointer-events:none;z-index:20;box-shadow:var(--sh)}
#toast.s{opacity:1}
footer{background:linear-gradient(90deg,#071433,#0f2a63);color:#b9c9ee;text-align:center;font-size:13.5px;padding:22px 16px;margin-top:20px}
footer img{width:40px;height:40px;border-radius:50%;display:block;margin:0 auto 6px}
@media(max-width:560px){.two{grid-template-columns:1fr}.hero{flex-direction:column-reverse;text-align:center;padding:22px 16px}.hero .hlogo{width:110px;height:110px}.bd{justify-content:center}.hero h1{font-size:25px}}
</style></head><body>

 var it=cart.map(function(id){return books.filter(function(b){return b.id==id})[0]}).filter(Boolean),tot=it.reduce(function(s,b){return s+b.p},0);
 if(!it.length){$('#app').innerHTML='<div class="box"><h2>🛒 শপিং কার্ট</h2><p class="mu">কার্ট খালি। বই বেছে নিন।</p><a class="btn" href="#home">📚 বই দেখুন</a></div>';return}
 $('#app').innerHTML='<div class="box"><h2>🛒 শপিং কার্ট</h2>'+it.map(function(b){return '<div class="row"><span>'+esc(b.e)+' '+esc(b.t)+'</span><span><b>'+money(b.p)+'</b> <button class="btn g" onclick="rm('+b.id+')">✕</button></span></div>'}).join('')+
 '<div class="row"><b>সর্বমোট</b><b class="pr">'+money(tot)+'</b></div></div>'+
 '<div class="box"><h2>💳 চেকআউট</h2><label>আপনার নাম</label><input id="cn" value="'+esc(user?user.name:'')+'"><label>মোবাইল নম্বর</label><input id="cp" inputmode="tel" value="'+esc(user?user.phone:'')+'"><label>WhatsApp নম্বর</label><input id="cw" inputmode="tel" placeholder="01XXXXXXXXX"><label>ইমেইল</label><input id="ce" type="email" placeholder="name@example.com">'+
 '<label>পেমেন্ট মাধ্যম</label><select id="cm" onchange="pm()"><option value="bkash">বিকাশ</option><option value="nagad">নগদ</option><option value="online">অন্যান্য অনলাইন পেমেন্ট</option></select>'+
 '<div class="note" id="pn" style="margin-top:10px"></div><label>ট্রানজ্যাকশন আইডি (TrxID)</label><input id="ct" placeholder="যেমন: 8N7A6D5E">'+
 '<button class="btn" style="margin-top:14px;width:100%" onclick="order()">✅ অর্ডার নিশ্চিত করুন</button></div>';pm()}

 n.innerHTML=m=='online'?'অন্য কোনো অনলাইন পেমেন্টের তথ্য অ্যাডমিন যোগাযোগ করে জানাবেন। TrxID/রেফারেন্স নম্বর লিখুন।':'<b>'+(m=='bkash'?'বিকাশ':'নগদ')+'</b> পার্সোনাল নম্বরে <b>Send Money</b> করুন: <b>'+esc(num(m))+'</b><br>তারপর নিচে TrxID লিখুন।'}

 var o={id:'EB'+Math.floor(10000+Math.random()*89999),name:n,phone:p,wa:w,em:em,items:it.map(function(b){return {t:b.t,p:b.p,f:b.f}}),total:it.reduce(function(s,b){return s+b.p},0),method:$('#cm').value,trx:t,status:'pending',date:new Date().toLocaleString('bn-BD')};
 o.ts=Date.now();orders.unshift(o);dbSet('orders',o.id,o);cart=[];user={name:n,phone:p};save();lastOrder=o;view()}

 var o=orders.filter(function(x){return x.id==i&&x.phone==p})[0];$('#tr').innerHTML=o?ocard(o):'<p class="mu">কোনো অর্ডার পাওয়া যায়নি। নম্বর ঠিক আছে কিনা দেখুন।</p>'}
function account(){
 if(!user){$('#app').innerHTML='<div class="box"><h2>👤 ক্রেতার অ্যাকাউন্ট</h2><label>নাম</label><input id="an"><label>মোবাইল নম্বর</label><input id="ap" inputmode="tel"><button class="btn" style="margin-top:12px" onclick="login()">প্রবেশ করুন</button></div>';return}
 var mine=orders.filter(function(o){return o.phone==user.phone});
 $('#app').innerHTML='<div class="box"><h2>👤 '+esc(user.name)+'</h2><p class="mu">'+esc(user.phone)+'</p><button class="btn g" onclick="user=null;save();view()">লগআউট</button></div><h3>আমার অর্ডার</h3>'+(mine.map(ocard).join('')||'<p class="mu">এখনো কোনো অর্ডার নেই।</p>')}

function adminV(){
 if(!admin){$('#app').innerHTML='<div class="box"><h2>🔐 অ্যাডমিন লগইন</h2><label>পাসওয়ার্ড</label><input id="ap" type="password"><button class="btn" style="margin-top:12px" onclick="if($(\'#ap\').value==cfg.pass){admin=true;view()}else toast(\'ভুল পাসওয়ার্ড\')">লগইন</button></div>';return}
 var tb=[['books','📚 বই'],['orders','📦 অর্ডার ('+bn(orders.length)+')'],['set','⚙️ সেটিংস']];
 var h='<div class="tabs">'+tb.map(function(t){return '<button class="chip'+(atab==t[0]?' on':'')+'" onclick="atab=\''+t[0]+'\';adminV()">'+t[1]+'</button>'}).join('')+'<button class="chip" onclick="admin=false;view()">লগআউট</button></div>';
 if(atab=='books')h+='<div class="box"><h3>➕ নতুন বই যোগ করুন</h3><label>বইয়ের নাম</label><input id="bt"><div class="two"><div><label>লেখক</label><input id="ba"></div><div><label>ক্যাটাগরি</label><input id="bc" list="cl"><datalist id="cl">'+cats().slice(1).map(function(c){return '<option value="'+esc(c)+'">'}).join('')+'</datalist></div></div><div class="two"><div><label>দাম (টাকা)</label><input id="bp" type="number" min="0"></div><div><label>আইকন (ইমোজি)</label><input id="be" value="📖"></div></div><label>বইয়ের কভার ছবি (ঐচ্ছিক)</label><input id="bi" type="file" accept="image/*"><label>পিডিএফ ডাউনলোড লিংক (গুগল ড্রাইভ ইত্যাদি)</label><input id="bf" placeholder="https://"><button class="btn" style="margin-top:12px" onclick="addBook()">বই যোগ করুন</button></div><div class="box"><h3>সব বই</h3>'+books.map(function(b){return '<div class="row"><span>'+esc(b.e)+' '+esc(b.t)+' <span class="mu">('+esc(b.c)+')</span></span><span>'+money(b.p)+' <button class="btn g" onclick="editP('+b.id+')">দাম</button> <button class="btn r" onclick="delBook('+b.id+')">মুছুন</button></span></div>'}).join('')+'</div>';
 if(atab=='orders')h+=orders.length?orders.map(function(o,i){return '<div class="box"><div class="row"><b>'+esc(o.id)+' · '+esc(o.name)+'</b><span class="tag'+ST[o.status][1]+'">'+ST[o.status][0]+'</span></div><div class="mu">'+esc(o.phone)+(o.wa?' · WhatsApp: '+esc(o.wa):'')+(o.em?' · '+esc(o.em):'')+' · '+(o.method=='bkash'?'বিকাশ':o.method=='nagad'?'নগদ':'অনলাইন')+' · TrxID: <b>'+esc(o.trx)+'</b> · '+money(o.total)+'</div><div>'+o.items.map(function(x){return esc(x.t)}).join('، ')+'</div><div style="margin-top:8px"><button class="btn" onclick="setS('+i+',\'paid\')">✅ নিশ্চিত</button> <button class="btn r" onclick="setS('+i+',\'rejected\')">❌ বাতিল</button> <button class="btn g" onclick="setS('+i+',\'pending\')">⏳ পেন্ডিং</button></div></div>'}).join(''):'<p class="mu">এখনো কোনো অর্ডার নেই।</p>';
 if(atab=='set')h+='<div class="box"><h3>⚙️ সেটিংস</h3><label>বিকাশ নম্বর</label><input id="sb" value="'+esc(cfg.bkash)+'"><label>নগদ নম্বর</label><input id="sn" value="'+esc(cfg.nagad)+'"><label>অ্যাডমিন পাসওয়ার্ড</label><input id="sp" value="'+esc(cfg.pass)+'"><button class="btn" style="margin-top:12px" onclick="saveCfg()">সংরক্ষণ</button></div>';
 $('#app').innerHTML=h}
function addBook(){var fi=$('#bi').files[0];if(!fi)return addBook2('');var r=new FileReader();r.onload=function(){var im=new Image();im.onload=function(){var c=document.createElement('canvas'),s=Math.min(1,400/im.width);c.width=im.width*s;c.height=im.height*s;c.getContext('2d').drawImage(im,0,0,c.width,c.height);addBook2(c.toDataURL('image/jpeg',0.8))};im.onerror=function(){toast('ছবিটি পড়া যায়নি');addBook2('')};im.src=r.result};r.readAsDataURL(fi)}
